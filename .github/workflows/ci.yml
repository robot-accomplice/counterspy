name: CI

# Runs on every push to the long-lived branches and on every PR (feature→develop, develop→main).
# Feature-branch pushes are validated through their PRs.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # The full standard gate: gofmt, vet, build, race tests, coverage ≥80%, Codecov.
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  # Validate the release build + goreleaser config on every run (snapshot, no publish) so a broken
  # .goreleaser.yaml or a build that only fails under release flags is caught here — before a tag,
  # not during the release.
  release-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: goreleaser build check (snapshot, no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
