name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate the release on the SAME comprehensive checks CI runs — a tag never publishes code that
  # wouldn't pass CI.
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  goreleaser:
    needs: checks
    # macOS runner so the produced binaries match the platform; the build itself is pure Go.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed once the Homebrew tap block in .goreleaser.yaml is enabled:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
